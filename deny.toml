# cargo-deny 0.21 configuration. Run: cargo deny check

[graph]
# Check the dependency graph for every platform Pumpkin-Shell ships on (PRD §5).
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

[advisories]
# Vulnerable and unmaintained crates fail by default. Yanked versions fail too.
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses only. Add a license here only after checking it, and
# record why in docs/DECISIONS.md. BSD-3-Clause was added for ed25519-dalek and
# curve25519-dalek (2026-11-19).
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "ISC", "Unicode-3.0"]
confidence-threshold = 0.8

[licenses.private]
# Workspace crates are `publish = false` and have no license yet (DECISIONS Q6).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
