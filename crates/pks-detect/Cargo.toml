[package]
name = "pks-detect"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
pks-core = { path = "../pks-core", version = "0.0.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.13.5", features = ["blocking", "json"], default-features = false }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
