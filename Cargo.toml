[workspace]
resolver = "3"
members = ["crates/pks-core", "crates/pks-scan", "crates/pks-sandbox", "crates/pks-proxy", "crates/pks-detect", "crates/pks-registry", "crates/pks-cli"]

[workspace.package]
version = "1.0.4"
edition = "2024"
rust-version = "1.100.0"
publish = false
repository = "https://github.com/mazi3012/pumpkin-shell"
license = "MIT"  # DECISIONS Q6, answered 2026-11-22

[workspace.dependencies]
# Versions checked on crates.io before adding (tech.md "Versions" rule).
# Phase 3 additions checked 2026-11-19: serde 1.0.229 (2026-07-18),
# serde_json 1.0.154 (2026-10-11), libc 0.2.191 (2026-10-16),
# landlock 0.4.7 (2026-07-27). All MIT and/or Apache-2.0, none yanked.
# Phase 4 additions checked 2026-11-19: ignore 0.4.34 (2026-10-27),
# jsonc-parser 0.34.0 (2026-09-27), thiserror 2.0.21 (2026-09-23),
# tempfile 3.27.0 (2026-03-11), windows-sys 0.61.2 (2025-10-06; the
# windows-rs repo had a commit on 2026-11-18). All MIT and/or Apache-2.0
# (ignore: Unlicense OR MIT), none yanked.
# Phase 7 additions checked 2026-11-19: ed25519-dalek 3.0.0 (2026-07-06,
# BSD-3-Clause), sha2 0.11.1 (2026-10-12), toml 1.2.1 (2026-11-06),
# getrandom 0.4.3 (2026-06-17). Latest stable, none yanked.
clap = { version = "4.6.8", features = ["derive"] }
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
ignore = "0.4.34"
jsonc-parser = { version = "0.34.0", features = ["serde"] }
landlock = "0.4.7"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
# Phase 8 additions checked 2026-11-19: seccompiler 0.5.0 (2025-03-07 release,
# last commit 2026-07-27, Apache-2.0 OR BSD-3-Clause, not yanked). Used for the
# TIOCSTI seccomp filter only.
seccompiler = "0.5.0"
# Phase 14 additions checked 2026-11-21 (see DECISIONS.md): sha1 0.11.0,
# strsim 0.11.1, time 0.3.55. All MIT or MIT OR Apache-2.0. Later steps add
# more, each recorded in DECISIONS.md when it is added.
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
strsim = "0.11.1"
tempfile = "3.27.0"
time = { version = "0.3.55", default-features = false, features = ["std", "parsing", "formatting"] }
thiserror = "2.0.21"
toml = "1.2.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

# Phase 14 TLS client (step 2), checked on crates.io 2026-11-21 (see DECISIONS.md):
# all stable, none yanked. tower-service 0.3.3 is older than six months; it is
# a small, widely used Tokio project crate (stable-library exception).
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["aws-lc-sys"] }
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", default-features = false, features = ["client", "http1"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["native-tokio", "http1", "tls12", "aws-lc-rs"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["client-legacy", "http1", "tokio"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "aws_lc_rs", "logging", "tls12"] }
rustls-native-certs = "0.8.5"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "time"] }
tower-service = "0.3.3"

[workspace.lints.rust]
# tech.md: no `unsafe` except in thin, documented FFI wrappers. A crate that
# needs one overrides this locally, with a comment explaining why.
unsafe_code = "deny"

[workspace.lints.clippy]
# tech.md: no unwrap()/expect() on paths that handle untrusted input.
# clippy.toml allows them in tests.
unwrap_used = "deny"
expect_used = "deny"
