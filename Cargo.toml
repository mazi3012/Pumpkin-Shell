[workspace]
resolver = "3"
members = ["crates/pks-core", "crates/pks-scan", "crates/pks-sandbox", "crates/pks-proxy", "crates/pks-detect", "crates/pks-cli"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100.0"
publish = false
repository = "https://github.com/mazi3012/pumpkin-shell"
# license: not set until DECISIONS Q6 is answered.

[workspace.dependencies]
# Versions checked on crates.io before adding (tech.md "Versions" rule).
# Phase 3 additions checked 2026-11-19: serde 1.0.229 (2026-07-18),
# serde_json 1.0.154 (2026-10-11), libc 0.2.191 (2026-10-16),
# landlock 0.4.7 (2026-07-27). All MIT and/or Apache-2.0, none yanked.
# Phase 4 additions checked 2026-11-19: ignore 0.4.34 (2026-10-27),
# jsonc-parser 0.34.0 (2026-09-27), thiserror 2.0.21 (2026-09-23),
# tempfile 3.27.0 (2026-03-11), windows-sys 0.61.2 (2025-10-06; the
# windows-rs repo had a commit on 2026-11-18). All MIT and/or Apache-2.0
# (ignore: Unlicense OR MIT), none yanked.
# Phase 7 additions checked 2026-11-19: ed25519-dalek 3.0.0 (2026-07-06,
# BSD-3-Clause), sha2 0.11.1 (2026-10-12), toml 1.2.1 (2026-11-06),
# getrandom 0.4.3 (2026-06-17). Latest stable, none yanked.
clap = { version = "4.6.8", features = ["derive"] }
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
ignore = "0.4.34"
jsonc-parser = { version = "0.34.0", features = ["serde"] }
landlock = "0.4.7"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
# Phase 8 additions checked 2026-11-19: seccompiler 0.5.0 (2025-03-07 release,
# last commit 2026-07-27, Apache-2.0 OR BSD-3-Clause, not yanked). Used for the
# TIOCSTI seccomp filter only.
seccompiler = "0.5.0"
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.2.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[workspace.lints.rust]
# tech.md: no `unsafe` except in thin, documented FFI wrappers. A crate that
# needs one overrides this locally, with a comment explaining why.
unsafe_code = "deny"

[workspace.lints.clippy]
# tech.md: no unwrap()/expect() on paths that handle untrusted input.
# clippy.toml allows them in tests.
unwrap_used = "deny"
expect_used = "deny"
