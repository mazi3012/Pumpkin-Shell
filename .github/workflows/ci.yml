name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to commit SHAs; the tag is in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install

      - name: Install cargo-deny and cargo-audit
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny@0.21.0,cargo-audit@0.23.0,cargo-vet@0.10.3

      # The sandbox tests run real bubblewrap, Xephyr and xauth (Linux only).
      # Ubuntu 24.04 restricts unprivileged user namespaces with AppArmor, so
      # the runner allows them. Both steps are Linux-only.
      - name: Install sandbox tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap xserver-xephyr xvfb xauth x11-utils curl python3
      - name: Allow unprivileged user namespaces (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Xephyr is a nested server and needs a host X display. A headless runner
      # has none, so start a virtual one (Xvfb) for the test steps.
      - name: Start a virtual X display (Linux)
        if: runner.os == 'Linux'
        run: |
          nohup Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp > /tmp/xvfb.log 2>&1 &
          for i in $(seq 1 20); do DISPLAY=:99 xdpyinfo >/dev/null 2>&1 && break; sleep 0.5; done
          DISPLAY=:99 xdpyinfo >/dev/null && echo "DISPLAY=:99" >> "$GITHUB_ENV" && echo "virtual display :99 ready"
      - name: Show sandbox prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "kernel: $(uname -r)"
          echo "lsm: $(cat /sys/kernel/security/lsm 2>/dev/null || echo unreadable)"
          echo "apparmor_restrict_unprivileged_userns: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo absent)"
          echo "bwrap: $(bwrap --version 2>&1)"
          echo "Xephyr: $(command -v Xephyr || echo missing)"
          echo "xauth: $(command -v xauth || echo missing)"
          bwrap --unshare-user --ro-bind / / true && echo "bwrap userns probe: ok" || echo "bwrap userns probe: FAILED"
      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Scan fails on hidden Unicode in .kiro/steering (PRD scenario 11)
        shell: bash
        run: |
          code=0
          cargo run --locked --quiet -- scan --ci tests/fixtures/scan/ws-hidden-unicode || code=$?
          echo "exit code: $code"
          test "$code" -eq 1
      - name: Scan passes on the clean fixture
        shell: bash
        run: cargo run --locked --quiet -- scan --ci tests/fixtures/scan/clean
      - name: cargo-deny
        run: cargo deny check
      # Every dependency is either audited (an imported or local audit) or listed
      # as an exemption in supply-chain/. A new unvetted crate fails this step.
      - name: cargo-vet
        run: cargo vet --locked

      - name: cargo-audit
        run: cargo audit
