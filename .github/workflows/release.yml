name: Release
# Phase 18.1. Runs when a version tag is pushed (v1.0.0 and so on). Builds the
# Debian package, signs it keylessly with cosign (Sigstore, identity from the
# GitHub workflow), and attaches SLSA provenance. The tag must match the
# version in Cargo.toml; packaging/build-deb.sh checks that.
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      digests: ${{ steps.hash.outputs.digests }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      # Actions are pinned to commit SHAs; the tag is in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install
      - name: Read the version from the tag
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build the Debian package
        run: packaging/build-deb.sh "${{ steps.meta.outputs.version }}"
      - name: Hash the artifacts for provenance
        id: hash
        run: |
          cd dist
          echo "digests=$(sha256sum *.deb | base64 -w0)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*.deb
          if-no-files-found: error

  sign:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign each package keylessly and write a bundle
        run: |
          cd dist
          for file in *.deb; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done
      - name: Attach the packages and signatures to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See docs/ESCAPE-CORPUS.md for the escape corpus result of this release." dist/* || gh release upload "$GITHUB_REF_NAME" dist/* --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: signatures
          path: dist/*.sigstore.json

  provenance:
    # After sign, which creates the release the provenance is attached to.
    needs: [package, sign]
    permissions:
      actions: read
      id-token: write
      contents: write
    # SLSA's generator is referenced by tag, as its documentation requires.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.package.outputs.digests }}"
      upload-assets: true
