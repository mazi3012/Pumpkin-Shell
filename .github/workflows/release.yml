name: Release
# Phase 18.1. Runs when a version tag is pushed (v1.0.0 and so on). Builds the
# Debian and RPM packages, signs each one keylessly with cosign (Sigstore,
# identity from this GitHub workflow), and attaches SLSA provenance. The tag
# must match the version in Cargo.toml; the build scripts check that.
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  package-deb:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # Actions are pinned to commit SHAs; the tag is in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install
      - name: Build the Debian package
        run: packaging/build-deb.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error

  package-rpm:
    runs-on: ubuntu-24.04
    # Fedora, so the RPM is built with Fedora's own toolchain. The tag is pinned.
    container: fedora:45
    permissions:
      contents: read
    steps:
      - name: Install the build tools
        run: dnf install -y rpm-build rpmdevtools cargo rust gcc git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the RPM from a source archive
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$cargo_version" != "$version" ]; then
              echo "Cargo.toml says $cargo_version, not $version" >&2
              exit 2
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sed -i "s/^Version:.*/Version:        $version/" packaging/rpm/pumpkin-shell.spec
          mkdir -p "$HOME/rpmbuild/SOURCES" dist
          git archive --format=tar.gz --prefix="pumpkin-shell-$version/" \
            -o "$HOME/rpmbuild/SOURCES/pumpkin-shell-$version.tar.gz" HEAD
          rpmbuild -ba packaging/rpm/pumpkin-shell.spec
          cp "$HOME/rpmbuild/RPMS/x86_64/"*.rpm dist/
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm
          if-no-files-found: error

  sign:
    needs: [package-deb, package-rpm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    outputs:
      digests: ${{ steps.hash.outputs.digests }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: rpm
          path: dist
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign each package keylessly and write a bundle
        run: |
          cd dist
          for file in *.deb *.rpm; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done
      - name: Hash the packages for provenance
        id: hash
        run: |
          cd dist
          echo "digests=$(sha256sum *.deb *.rpm | base64 -w0)" >> "$GITHUB_OUTPUT"
      - name: Create the release and attach packages and signatures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This job does not check out the repository, so name it explicitly.
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Escape corpus v1: see docs/ESCAPE-CORPUS.md." dist/* \
            || gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  provenance:
    # SLSA's generator is referenced by tag, as its documentation requires.
    needs: sign
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.sign.outputs.digests }}"
      upload-assets: true
